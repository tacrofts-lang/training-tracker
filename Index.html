<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TRAIN." />
  <meta name="theme-color" content="#0A0A0F" />
  <title>TRAIN.</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #0A0A0F; color: #F2F2F8; font-family: 'IBM Plex Mono', 'Courier New', monospace; min-height: 100vh; -webkit-tap-highlight-color: transparent; }
    #root { max-width: 480px; margin: 0 auto; }
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    input, textarea, button, select { font-family: inherit; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const INITIAL_PLAN = {
      A: {
        name: "Day A — Push & Pull",
        exercises: [
          { name: "Barbell Back Squat", sets: 3, reps: 8, rpe: "7/10 — controlled depth" },
          { name: "Dumbbell Bench Press", sets: 3, reps: 10, rpe: "Leave 2 reps in tank" },
          { name: "Cable Row (Seated)", sets: 3, reps: 10, rpe: "Full stretch, controlled pull" },
          { name: "Dumbbell Shoulder Press", sets: 3, reps: 10, rpe: "No arching lower back" },
          { name: "Romanian Deadlift", sets: 3, reps: 10, rpe: "Light-moderate, hinge well" },
          { name: "Plank", sets: 3, reps: "45s", rpe: "Brace hard, neutral spine" },
        ],
        finisher: {
          name: "The Burner",
          duration: "12 mins",
          rest: "90 sec between rounds",
          rounds: 3,
          exercises: [
            { name: "Ski Erg", detail: "250m per round" },
            { name: "Burpee Broad Jumps", detail: "10 reps — full explosive jump forward" },
            { name: "Farmers Carry", detail: "40m — as heavy as you can maintain posture" },
          ],
        },
      },
      B: {
        name: "Day B — Hinge & Pull",
        exercises: [
          { name: "Conventional Deadlift", sets: 3, reps: 6, rpe: "Moderate — perfect form priority" },
          { name: "Incline Dumbbell Press", sets: 3, reps: 10, rpe: "30–45° incline, controlled" },
          { name: "Pull-Ups / Lat Pulldown", sets: 3, reps: 10, rpe: "Full hang, squeeze at top" },
          { name: "Goblet Squat", sets: 3, reps: 12, rpe: "Lighter than Day A squats" },
          { name: "Cable Lateral Raise", sets: 3, reps: 12, rpe: "Slow eccentric — 3 sec down" },
          { name: "Dead Bug", sets: 3, reps: "8 each", rpe: "Lower back stays flat — always" },
        ],
        finisher: {
          name: "The Grind",
          duration: "12 mins",
          rest: "90 sec between rounds",
          rounds: 3,
          exercises: [
            { name: "Rowing Machine", detail: "250m per round — strong drive" },
            { name: "Wall Balls", detail: "15 reps — 6–9kg ball, full squat" },
            { name: "Sled Push or Pull", detail: "20m — load moderate, fast feet" },
          ],
        },
      },
    };

    const STORAGE_KEY = "trk_v2";
    const C = {
      bg: "#0A0A0F", surface: "#12121A", card: "#1A1A24", border: "#252535",
      accent: "#C8FF57", accentDim: "#C8FF5718", accentMid: "#C8FF5740",
      red: "#FF5757", blue: "#57B8FF", text: "#F2F2F8", muted: "#6B6B88",
    };
    const FD = "'Bebas Neue', Impact, sans-serif";
    const FM = "'IBM Plex Mono', 'Courier New', monospace";

    function loadState() {
      try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch {}
      return { logs: [], stats: [], currentPlan: INITIAL_PLAN, weekBlock: 1, draftSession: null };
    }
    function saveState(s) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {} }

    function generateTCX(log) {
      const date = new Date(log.date).toISOString();
      let acts = "";
      Object.entries(log.sets || {}).forEach(([ex, sets]) => {
        Object.entries(sets).forEach(([si, s]) => {
          if (s.weight || s.reps) {
            acts += `<Activity Sport="Other"><Id>${date}</Id><Lap StartTime="${date}"><TotalTimeSeconds>60</TotalTimeSeconds><Notes>${ex} — Set ${parseInt(si)+1}: ${s.weight||"?"}kg x ${s.reps||"?"} reps</Notes><Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod></Lap></Activity>`;
          }
        });
      });
      return `<?xml version="1.0" encoding="UTF-8"?><TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2"><Activities>${acts}</Activities></TrainingCenterDatabase>`;
    }

    function downloadTCX(log) {
      const blob = new Blob([generateTCX(log)], { type: "application/xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `session_${new Date(log.date).toISOString().slice(0,10)}.tcx`; a.click();
      URL.revokeObjectURL(url);
    }

    async function generateNextPlan(logs, currentPlan, weekBlock) {
      const summary = logs.slice(0, 10).map(l => ({
        day: l.day, date: l.date,
        exercises: Object.entries(l.sets || {}).map(([ex, sets]) => ({ name: ex, bests: Object.values(sets).map(s => `${s.weight||"?"}kg x ${s.reps||"?"}`) }))
      }));
      const prompt = `You are an S&C coach. Build a new 4-week gym plan. Goals: fat loss, lean muscle. Lower back issues — no heavy axial loading, build core. Full gym. 2x/week full body. Each session: 6 exercises + Hyrox finisher (3 exercises, 3 rounds, 12 mins).
Previous exercises Day A: ${currentPlan.A.exercises.map(e=>e.name).join(", ")}
Previous exercises Day B: ${currentPlan.B.exercises.map(e=>e.name).join(", ")}
Performance: ${JSON.stringify(summary)}
Introduce 3-4 NEW exercise variations. Progressive overload from logged weights. Rep ranges 10-15 accessories, 6-10 compounds.
Return ONLY valid JSON, no markdown:
{"A":{"name":"Day A — [theme]","exercises":[{"name":"...","sets":3,"reps":10,"rpe":"coaching cue"}],"finisher":{"name":"...","duration":"12 mins","rest":"90 sec between rounds","rounds":3,"exercises":[{"name":"...","detail":"..."}]}},"B":{...same...}}`;
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: prompt }] })
      });
      const data = await res.json();
      const text = data.content?.map(c => c.text || "").join("") || "";
      return JSON.parse(text.replace(/```json|```/g, "").trim());
    }

    function App() {
      const [state, setState] = useState(loadState);
      const [tab, setTab] = useState(0);
      const [day, setDay] = useState("A");
      const [setLogs, setSetLogs] = useState({});
      const [finLogs, setFinLogs] = useState({});
      const [finDone, setFinDone] = useState(false);
      const [note, setNote] = useState("");
      const [statEntry, setStatEntry] = useState({ weight: "", feel: "3", note: "" });
      const [flash, setFlash] = useState("");
      const [generating, setGenerating] = useState(false);
      const [expanded, setExpanded] = useState(null);
      const [activeWeek, setActiveWeek] = useState(1);
      const plan = state.currentPlan;

      useEffect(() => {
        if (state.draftSession) {
          setDay(state.draftSession.day || "A");
          setSetLogs(state.draftSession.setLogs || {});
          setFinLogs(state.draftSession.finLogs || {});
          setFinDone(state.draftSession.finDone || false);
          setNote(state.draftSession.note || "");
        }
      }, []);

      const upd = useCallback((patch) => {
        setState(prev => { const next = { ...prev, ...patch }; saveState(next); return next; });
      }, []);

      useEffect(() => {
        upd({ draftSession: { day, setLogs, finLogs, finDone, note } });
      }, [day, setLogs, finLogs, finDone, note]);

      const flash2 = (m) => { setFlash(m); setTimeout(() => setFlash(""), 2500); };

      const handleSet = (ex, si, field, val) =>
        setSetLogs(p => ({ ...p, [ex]: { ...(p[ex]||{}), [si]: { ...(p[ex]?.[si]||{}), [field]: val } } }));

      const handleFin = (ex, field, val) =>
        setFinLogs(p => ({ ...p, [ex]: { ...(p[ex]||{}), [field]: val } }));

      const submit = () => {
        const entry = { id: Date.now(), date: new Date().toISOString(), type: "gym", day, dayName: plan[day].name, sets: setLogs, finLogs, finisher: finDone, note, week: state.weekBlock };
        upd({ logs: [entry, ...state.logs], draftSession: null });
        setSetLogs({}); setFinLogs({}); setFinDone(false); setNote("");
        flash2("Session saved ✓");
      };

      const submitStat = () => {
        if (!statEntry.weight) return;
        upd({ stats: [{ id: Date.now(), date: new Date().toISOString(), ...statEntry }, ...state.stats] });
        setStatEntry({ weight: "", feel: "3", note: "" });
        flash2("Stats logged ✓");
      };

      const genPlan = async () => {
        setGenerating(true);
        try {
          const newPlan = await generateNextPlan(state.logs, plan, state.weekBlock);
          upd({ currentPlan: newPlan, weekBlock: state.weekBlock + 1 });
          flash2("New block generated ✓");
        } catch { flash2("Generation failed — check connection"); }
        setGenerating(false);
      };

      const bests = {};
      state.logs.forEach(l => Object.entries(l.sets || {}).forEach(([ex, sets]) =>
        Object.values(sets).forEach(s => { const w = parseFloat(s.weight); if (!isNaN(w) && w > 0 && (!bests[ex] || w > bests[ex])) bests[ex] = w; })
      ));

      const feels = ["😩","😕","😐","😊","💪"];
      const TABS = ["Session","Plan","History","Stats"];
      const hasDraft = state.draftSession && (Object.keys(state.draftSession.setLogs||{}).length > 0 || state.draftSession.finDone);

      const inp = { background: C.surface, border: `1px solid ${C.border}`, color: C.text, padding: "9px 10px", fontSize: 14, fontFamily: FM, flex: 1, outline: "none", borderRadius: 2, WebkitAppearance: "none" };
      const lbl = { display: "block", fontSize: 9, letterSpacing: 4, textTransform: "uppercase", color: C.muted, marginBottom: 7 };

      return (
        <div style={{ background: C.bg, minHeight: "100vh", fontFamily: FM, color: C.text, paddingBottom: 100 }}>

          {flash && (
            <div style={{ position: "fixed", bottom: 100, left: "50%", transform: "translateX(-50%)", background: C.accent, color: C.bg, padding: "10px 24px", fontSize: 11, letterSpacing: 3, fontWeight: 700, zIndex: 100, borderRadius: 3, whiteSpace: "nowrap" }}>
              {flash}
            </div>
          )}

          {/* Header */}
          <div style={{ padding: "env(safe-area-inset-top, 20px) 20px 20px", paddingTop: "max(env(safe-area-inset-top), 28px)", borderBottom: `1px solid ${C.border}` }}>
            <div style={{ display: "inline-block", background: C.accentDim, border: `1px solid ${C.accentMid}`, color: C.accent, fontSize: 9, letterSpacing: 4, textTransform: "uppercase", padding: "4px 10px", marginBottom: 8, borderRadius: 2 }}>
              Block {state.weekBlock} · Fat Loss
            </div>
            <div style={{ fontSize: 52, lineHeight: 1, fontFamily: FD, letterSpacing: 3 }}>
              TRAIN<span style={{ color: C.accent }}>.</span>
            </div>
            <div style={{ fontSize: 9, color: C.muted, letterSpacing: 3, textTransform: "uppercase", marginTop: 4 }}>
              {new Date().toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long" })}
            </div>
          </div>

          {hasDraft && tab !== 0 && (
            <div style={{ margin: "12px 20px 0", background: `${C.blue}15`, border: `1px solid ${C.blue}40`, padding: "12px 16px", display: "flex", justifyContent: "space-between", alignItems: "center", borderRadius: 3 }}>
              <span style={{ fontSize: 10, color: C.blue, letterSpacing: 2 }}>📝 Draft in progress</span>
              <button onClick={() => setTab(0)} style={{ background: "none", border: "none", color: C.blue, fontSize: 10, letterSpacing: 2, cursor: "pointer" }}>RESUME →</button>
            </div>
          )}

          {/* Tab Bar */}
          <div style={{ display: "flex", borderBottom: `1px solid ${C.border}`, position: "sticky", top: 0, background: C.bg, zIndex: 10 }}>
            {TABS.map((t, i) => (
              <button key={t} onClick={() => setTab(i)} style={{ flex: 1, padding: "14px 4px", fontSize: 9, letterSpacing: 2, textTransform: "uppercase", background: "none", border: "none", borderBottom: tab === i ? `2px solid ${C.accent}` : "2px solid transparent", color: tab === i ? C.accent : C.muted, cursor: "pointer" }}>
                {t}
              </button>
            ))}
          </div>

          <div style={{ padding: "20px 20px 0" }}>

            {/* SESSION TAB */}
            {tab === 0 && (
              <div>
                {hasDraft && (
                  <div style={{ background: `${C.blue}15`, border: `1px solid ${C.blue}40`, padding: "10px 14px", marginBottom: 16, borderRadius: 3, fontSize: 10, color: C.blue, letterSpacing: 2 }}>
                    ↩ Draft restored — carry on
                  </div>
                )}
                <label style={lbl}>Select Day</label>
                <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                  {["A","B"].map(d => (
                    <button key={d} onClick={() => setDay(d)} style={{ flex: 1, padding: "12px 0", fontSize: 10, letterSpacing: 3, textTransform: "uppercase", border: `1px solid ${day===d ? C.accent : C.border}`, background: day===d ? C.accent : "transparent", color: day===d ? C.bg : C.muted, cursor: "pointer", fontWeight: day===d ? 700 : 400, borderRadius: 2 }}>
                      Day {d}
                    </button>
                  ))}
                </div>
                <div style={{ fontSize: 10, color: C.muted, marginBottom: 20, letterSpacing: 2 }}>{plan[day].name}</div>

                {plan[day].exercises.map(ex => (
                  <div key={ex.name} style={{ background: C.card, border: `1px solid ${C.border}`, padding: 16, marginBottom: 10, borderRadius: 3 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 6 }}>
                      <div style={{ flex: 1, paddingRight: 10 }}>
                        <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 2 }}>{ex.name}</div>
                        <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, textTransform: "uppercase", marginBottom: 4 }}>{ex.sets} sets × {ex.reps} reps</div>
                        <div style={{ fontSize: 10, color: C.accent, fontStyle: "italic", marginBottom: 10 }}>💡 {ex.rpe}</div>
                      </div>
                      {bests[ex.name] && (
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 8, color: C.muted, letterSpacing: 2 }}>BEST</div>
                          <div style={{ fontSize: 18, fontFamily: FD, color: C.accent }}>{bests[ex.name]}kg</div>
                        </div>
                      )}
                    </div>
                    {Array.from({ length: ex.sets }).map((_, i) => (
                      <div key={i} style={{ display: "flex", gap: 8, marginBottom: 7, alignItems: "center" }}>
                        <span style={{ fontSize: 9, color: C.muted, width: 28 }}>S{i+1}</span>
                        <input style={inp} type="number" placeholder="kg" value={setLogs[ex.name]?.[i]?.weight||""} onChange={e => handleSet(ex.name, i, "weight", e.target.value)} />
                        <input style={inp} type="number" placeholder="reps" value={setLogs[ex.name]?.[i]?.reps||""} onChange={e => handleSet(ex.name, i, "reps", e.target.value)} />
                      </div>
                    ))}
                  </div>
                ))}

                {/* Finisher */}
                {(() => {
                  const fin = plan[day].finisher;
                  return (
                    <div style={{ background: `linear-gradient(135deg, ${C.accentDim}, transparent)`, border: `1px solid ${C.accentMid}`, padding: 16, marginBottom: 10, borderRadius: 3 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 14 }}>
                        <div style={{ fontSize: 12, letterSpacing: 4, textTransform: "uppercase", color: C.accent }}>🔥 {fin.name}</div>
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 9, color: C.muted }}>{fin.rounds} rounds · {fin.duration}</div>
                          <div style={{ fontSize: 9, color: C.muted }}>{fin.rest}</div>
                        </div>
                      </div>
                      {fin.exercises.map(ex => (
                        <div key={ex.name} style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 12, marginBottom: 8, borderRadius: 2 }}>
                          <div style={{ fontSize: 12, fontWeight: 600, marginBottom: 2 }}>{ex.name}</div>
                          <div style={{ fontSize: 10, color: C.muted, marginBottom: 8 }}>{ex.detail}</div>
                          <div style={{ display: "flex", gap: 8 }}>
                            <input style={inp} type="text" placeholder="Weight / load" value={finLogs[ex.name]?.weight||""} onChange={e => handleFin(ex.name, "weight", e.target.value)} />
                            <input style={inp} type="text" placeholder="Reps / distance" value={finLogs[ex.name]?.reps||""} onChange={e => handleFin(ex.name, "reps", e.target.value)} />
                          </div>
                        </div>
                      ))}
                      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10 }}>
                        <input type="checkbox" style={{ accentColor: C.accent, width: 18, height: 18 }} checked={finDone} onChange={e => setFinDone(e.target.checked)} />
                        <span style={{ fontSize: 11, letterSpacing: 1 }}>Finisher completed ✓</span>
                      </div>
                    </div>
                  );
                })()}

                <label style={{ ...lbl, marginTop: 14 }}>Session Notes</label>
                <textarea style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, color: C.text, padding: 12, fontSize: 12, fontFamily: FM, resize: "none", outline: "none", borderRadius: 2 }} rows={3} placeholder="How did it feel?" value={note} onChange={e => setNote(e.target.value)} />
                <button style={{ width: "100%", padding: "15px 0", background: C.accent, color: C.bg, fontSize: 10, letterSpacing: 4, textTransform: "uppercase", border: "none", cursor: "pointer", fontWeight: 700, marginTop: 10, borderRadius: 2 }} onClick={submit}>
                  Save Session
                </button>
              </div>
            )}

            {/* PLAN TAB */}
            {tab === 1 && (
              <div>
                <div style={{ fontSize: 9, color: C.muted, letterSpacing: 4, textTransform: "uppercase", marginBottom: 16 }}>Block {state.weekBlock} — Your Plan</div>
                <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                  {[1,2,3,4].map(w => (
                    <button key={w} onClick={() => setActiveWeek(w)} style={{ flex: 1, padding: "8px 0", fontSize: 9, letterSpacing: 2, border: `1px solid ${activeWeek===w ? C.accent : C.border}`, background: activeWeek===w ? C.accentDim : "transparent", color: activeWeek===w ? C.accent : C.muted, cursor: "pointer", borderRadius: 2 }}>
                      W{w}
                    </button>
                  ))}
                </div>
                <div style={{ fontSize: 10, color: C.muted, marginBottom: 20, lineHeight: 1.8 }}>
                  {["Foundation — form & technique","Build — add weight where you can","Push — higher intensity","Consolidate — test your bests"][activeWeek-1]}
                </div>
                {["A","B"].map(d => (
                  <div key={d} style={{ background: C.card, border: `1px solid ${C.border}`, padding: 16, marginBottom: 16, borderRadius: 3 }}>
                    <div style={{ fontSize: 22, fontFamily: FD, letterSpacing: 2, color: C.accent, marginBottom: 14 }}>{plan[d].name}</div>
                    {plan[d].exercises.map(ex => (
                      <div key={ex.name} style={{ borderBottom: `1px solid ${C.border}`, padding: "10px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                        <div>
                          <div style={{ fontSize: 12 }}>{ex.name}</div>
                          <div style={{ fontSize: 9, color: C.accent, marginTop: 2, fontStyle: "italic" }}>{ex.rpe}</div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div style={{ fontSize: 9, color: C.muted }}>{ex.sets}×{ex.reps}</div>
                          {bests[ex.name] && <div style={{ fontSize: 10, color: C.accent, marginTop: 2 }}>PB {bests[ex.name]}kg</div>}
                        </div>
                      </div>
                    ))}
                    <div style={{ marginTop: 14, paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
                      <div style={{ fontSize: 10, color: C.accent, letterSpacing: 3, marginBottom: 6 }}>🔥 {plan[d].finisher.name}</div>
                      <div style={{ fontSize: 9, color: C.muted, marginBottom: 8 }}>{plan[d].finisher.rounds} rounds · {plan[d].finisher.duration} · {plan[d].finisher.rest}</div>
                      {plan[d].finisher.exercises.map(ex => (
                        <div key={ex.name} style={{ fontSize: 11, color: C.muted, padding: "3px 0" }}>· {ex.name} — {ex.detail}</div>
                      ))}
                    </div>
                  </div>
                ))}
                <div style={{ background: C.accentDim, border: `1px solid ${C.accentMid}`, padding: 16, marginTop: 4, borderRadius: 3, marginBottom: 4 }}>
                  <div style={{ fontSize: 10, color: C.accent, letterSpacing: 3, marginBottom: 8 }}>NEXT BLOCK</div>
                  <div style={{ fontSize: 11, color: C.muted, lineHeight: 1.8 }}>Complete 4 weeks then generate your next block. The AI analyses your logged weights and builds a fresh plan with new exercises.</div>
                </div>
                <button style={{ width: "100%", padding: "15px 0", background: generating ? C.surface : C.accent, color: C.bg, fontSize: 10, letterSpacing: 4, textTransform: "uppercase", border: "none", cursor: generating ? "not-allowed" : "pointer", fontWeight: 700, marginTop: 10, borderRadius: 2, opacity: generating ? 0.7 : 1 }} onClick={genPlan} disabled={generating}>
                  {generating ? "⚡ Generating..." : "⚡ Generate Next 4-Week Block"}
                </button>
              </div>
            )}

            {/* HISTORY TAB */}
            {tab === 2 && (
              <div>
                {state.logs.length === 0 && (
                  <div style={{ textAlign: "center", padding: "48px 0", color: C.muted, fontSize: 11, letterSpacing: 2, lineHeight: 2 }}>No sessions yet.<br/>Get after it.</div>
                )}
                {state.logs.map(log => (
                  <div key={log.id}>
                    <div style={{ borderBottom: `1px solid ${C.border}`, padding: "16px 0", cursor: "pointer" }} onClick={() => setExpanded(expanded === log.id ? null : log.id)}>
                      <div style={{ fontSize: 9, color: C.muted, letterSpacing: 3, marginBottom: 4, textTransform: "uppercase" }}>
                        {new Date(log.date).toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "short" })}{log.week ? ` · Block ${log.week}` : ""}
                      </div>
                      <div style={{ fontSize: 20, fontFamily: FD, letterSpacing: 1, marginBottom: 4 }}>{log.dayName}</div>
                      <div style={{ fontSize: 10, color: C.muted, display: "flex", justifyContent: "space-between" }}>
                        <span>{Object.keys(log.sets||{}).length} exercises{log.finisher ? " · Finisher ✓" : ""}</span>
                        <span style={{ color: C.accent }}>{expanded === log.id ? "▲" : "▼"}</span>
                      </div>
                    </div>
                    {expanded === log.id && (
                      <div style={{ background: C.surface, border: `1px solid ${C.border}`, padding: 14, marginBottom: 8, borderRadius: 2 }}>
                        {Object.entries(log.sets||{}).map(([ex, sets]) => (
                          <div key={ex} style={{ marginBottom: 10 }}>
                            <div style={{ fontSize: 11, color: C.accent, letterSpacing: 1, marginBottom: 4 }}>{ex}</div>
                            {Object.entries(sets).map(([si, s]) => (
                              <div key={si} style={{ fontSize: 10, color: C.muted, paddingLeft: 8 }}>Set {parseInt(si)+1}: {s.weight||"—"}kg × {s.reps||"—"} reps</div>
                            ))}
                          </div>
                        ))}
                        {Object.keys(log.finLogs||{}).length > 0 && (
                          <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
                            <div style={{ fontSize: 10, color: C.accent, letterSpacing: 2, marginBottom: 6 }}>FINISHER</div>
                            {Object.entries(log.finLogs).map(([ex, s]) => (
                              <div key={ex} style={{ fontSize: 10, color: C.muted, paddingLeft: 8 }}>{ex}: {s.weight||"—"} · {s.reps||"—"}</div>
                            ))}
                          </div>
                        )}
                        {log.note && <div style={{ fontSize: 10, color: C.muted, marginTop: 10, fontStyle: "italic" }}>"{log.note}"</div>}
                        <button onClick={() => downloadTCX(log)} style={{ width: "100%", padding: "12px 0", background: "transparent", color: C.blue, fontSize: 10, letterSpacing: 3, textTransform: "uppercase", border: `1px solid ${C.blue}`, cursor: "pointer", marginTop: 10, borderRadius: 2 }}>
                          ↓ Export to Training Peaks (.tcx)
                        </button>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}

            {/* STATS TAB */}
            {tab === 3 && (
              <div>
                <div style={{ background: C.card, border: `1px solid ${C.border}`, padding: 16, marginBottom: 10, borderRadius: 3 }}>
                  <div style={{ fontSize: 11, color: C.accent, letterSpacing: 3, marginBottom: 14 }}>LOG TODAY</div>
                  <label style={lbl}>Body Weight (kg)</label>
                  <input style={{ ...inp, width: "100%", marginBottom: 14 }} type="number" placeholder="e.g. 82.5" value={statEntry.weight} onChange={e => setStatEntry({...statEntry, weight: e.target.value})} />
                  <label style={lbl}>How do you feel?</label>
                  <div style={{ display: "flex", gap: 6, marginBottom: 14 }}>
                    {feels.map((f, i) => (
                      <button key={i} onClick={() => setStatEntry({...statEntry, feel: String(i+1)})} style={{ flex: 1, padding: "12px 0", fontSize: 20, border: `1px solid ${statEntry.feel === String(i+1) ? C.accent : C.border}`, background: statEntry.feel === String(i+1) ? C.accentDim : "transparent", cursor: "pointer", borderRadius: 2 }}>{f}</button>
                    ))}
                  </div>
                  <label style={lbl}>Notes</label>
                  <textarea style={{ width: "100%", background: C.surface, border: `1px solid ${C.border}`, color: C.text, padding: 10, fontSize: 12, fontFamily: FM, resize: "none", outline: "none", borderRadius: 2 }} rows={2} placeholder="Clothes fitting better? Energy? Sleep?" value={statEntry.note} onChange={e => setStatEntry({...statEntry, note: e.target.value})} />
                  <button style={{ width: "100%", padding: "14px 0", background: C.accent, color: C.bg, fontSize: 10, letterSpacing: 4, textTransform: "uppercase", border: "none", cursor: "pointer", fontWeight: 700, marginTop: 10, borderRadius: 2 }} onClick={submitStat}>Log Stats</button>
                </div>

                {state.stats.length > 0 && (
                  <>
                    <div style={{ fontSize: 9, color: C.muted, letterSpacing: 4, textTransform: "uppercase", margin: "24px 0 12px" }}>Weight Trend</div>
                    {state.stats.slice(0,10).map((st, i, arr) => {
                      const prev = arr[i+1];
                      const diff = prev ? (parseFloat(st.weight) - parseFloat(prev.weight)).toFixed(1) : null;
                      return (
                        <div key={st.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: `1px solid ${C.border}` }}>
                          <div>
                            <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2 }}>{new Date(st.date).toLocaleDateString("en-GB", { day: "numeric", month: "short" })}</div>
                            {st.note && <div style={{ fontSize: 9, color: C.muted, fontStyle: "italic", marginTop: 2 }}>{st.note}</div>}
                          </div>
                          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                            <span style={{ fontSize: 18 }}>{feels[parseInt(st.feel)-1]}</span>
                            <div style={{ textAlign: "right" }}>
                              <div style={{ fontSize: 20, fontFamily: FD }}>{st.weight}kg</div>
                              {diff !== null && <div style={{ fontSize: 9, color: parseFloat(diff) < 0 ? C.accent : C.red }}>{parseFloat(diff) < 0 ? "▼" : "▲"} {Math.abs(diff)}kg</div>}
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </>
                )}

                {Object.keys(bests).length > 0 && (
                  <>
                    <div style={{ fontSize: 9, color: C.muted, letterSpacing: 4, textTransform: "uppercase", margin: "24px 0 12px" }}>Personal Bests</div>
                    {Object.entries(bests).map(([ex, w]) => (
                      <div key={ex} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderBottom: `1px solid ${C.border}` }}>
                        <span style={{ fontSize: 11 }}>{ex}</span>
                        <span style={{ fontSize: 20, fontFamily: FD, color: C.accent }}>{w}kg</span>
                      </div>
                    ))}
                  </>
                )}
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRAIN.">
<meta name="theme-color" content="#0A0A0F">
<title>TRAIN.</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0A0A0F;color:#F2F2F8;font-family:'Courier New',monospace;min-height:100vh;padding-bottom:80px}
input,textarea,button{font-family:'Courier New',monospace}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
#app{max-width:480px;margin:0 auto}

.hdr{padding:28px 20px 20px;border-bottom:1px solid #252535}
.badge{display:inline-block;border:1px solid #C8FF5740;color:#C8FF57;font-size:9px;letter-spacing:3px;text-transform:uppercase;padding:3px 8px;margin-bottom:8px}
.ttl{font-size:48px;line-height:1;font-weight:700;letter-spacing:2px}
.ttl span{color:#C8FF57}
.dt{font-size:9px;color:#6B6B88;letter-spacing:3px;margin-top:4px}

.tabs{display:flex;border-bottom:1px solid #252535;position:sticky;top:0;background:#0A0A0F;z-index:9}
.tb{flex:1;padding:13px 2px;font-size:9px;letter-spacing:2px;text-transform:uppercase;background:none;border:none;border-bottom:2px solid transparent;color:#6B6B88;cursor:pointer}
.tb.on{border-bottom:2px solid #C8FF57;color:#C8FF57}

.sec{padding:18px 18px 0;display:none}
.sec.on{display:block}

.lbl{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:#6B6B88;margin-bottom:7px;margin-top:14px}
.row2{display:flex;gap:8px;margin-bottom:16px}
.dbtn{flex:1;padding:11px 0;font-size:9px;letter-spacing:3px;text-transform:uppercase;border:1px solid #252535;background:transparent;color:#6B6B88;cursor:pointer;border-radius:2px}
.dbtn.on{border-color:#C8FF57;background:#C8FF57;color:#0A0A0F;font-weight:700}

.card{background:#1A1A24;border:1px solid #252535;padding:14px;margin-bottom:10px;border-radius:3px}
.exn{font-size:13px;font-weight:700;margin-bottom:2px}
.exm{font-size:9px;color:#6B6B88;letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.exr{font-size:10px;color:#C8FF57;font-style:italic;margin-bottom:10px}
.exh{display:flex;justify-content:space-between;align-items:flex-start}
.pb{text-align:right}
.pbl{font-size:8px;color:#6B6B88;letter-spacing:2px}
.pbv{font-size:20px;font-weight:700;color:#C8FF57}

.sr{display:flex;gap:8px;margin-bottom:7px;align-items:center}
.sn{font-size:9px;color:#6B6B88;width:22px;flex-shrink:0}
.inp{background:#0D0D0D;border:1px solid #252535;color:#F2F2F8;padding:9px 10px;font-size:14px;flex:1;outline:none;border-radius:2px;width:100%;-webkit-appearance:none}

.fcard{background:#0D0D12;border:1px solid #C8FF5740;padding:14px;margin-bottom:10px;border-radius:3px}
.ftitle{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#C8FF57;margin-bottom:4px}
.fmeta{font-size:9px;color:#6B6B88;margin-bottom:12px}
.fex{background:#0A0A0F;border:1px solid #252535;padding:11px;margin-bottom:8px;border-radius:2px}
.fen{font-size:12px;font-weight:700;margin-bottom:2px}
.fed{font-size:10px;color:#6B6B88;margin-bottom:8px}
.fchk{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px}
.fchk input{width:18px;height:18px;cursor:pointer;accent-color:#C8FF57}

.ta{width:100%;background:#0D0D0D;border:1px solid #252535;color:#F2F2F8;padding:11px;font-size:12px;resize:none;outline:none;border-radius:2px}
.btnp{width:100%;padding:14px 0;background:#C8FF57;color:#0A0A0F;font-size:10px;letter-spacing:4px;text-transform:uppercase;border:none;cursor:pointer;font-weight:700;margin-top:10px;border-radius:2px}
.btno{width:100%;padding:12px 0;background:transparent;color:#57B8FF;font-size:10px;letter-spacing:3px;text-transform:uppercase;border:1px solid #57B8FF;cursor:pointer;margin-top:8px;border-radius:2px}

.flash{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#C8FF57;color:#0A0A0F;padding:10px 22px;font-size:11px;letter-spacing:3px;font-weight:700;z-index:99;border-radius:3px;white-space:nowrap;display:none}
.flash.on{display:block}

.li{border-bottom:1px solid #252535;padding:14px 0;cursor:pointer}
.ld{font-size:9px;color:#6B6B88;letter-spacing:3px;text-transform:uppercase;margin-bottom:3px}
.lt{font-size:20px;font-weight:700;letter-spacing:1px;margin-bottom:3px}
.lm{font-size:10px;color:#6B6B88;display:flex;justify-content:space-between}
.ldtl{background:#0D0D0D;border:1px solid #252535;padding:13px;margin-bottom:8px;border-radius:2px;display:none}
.ldtl.on{display:block}
.let{font-size:11px;color:#C8FF57;margin:8px 0 3px;letter-spacing:1px}
.les{font-size:10px;color:#6B6B88;padding-left:8px}

.feelrow{display:flex;gap:6px;margin-bottom:14px}
.fbtn{flex:1;padding:11px 0;font-size:20px;border:1px solid #252535;background:transparent;cursor:pointer;border-radius:2px}
.fbtn.on{border-color:#C8FF57;background:#C8FF5720}

.strow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #252535}
.std{font-size:9px;color:#6B6B88;letter-spacing:2px}
.str{display:flex;align-items:center;gap:10px}
.stw{font-size:20px;font-weight:700}
.stdf{font-size:9px;text-align:right}
.ddown{color:#C8FF57}
.dup{color:#FF5757}

.prow{border-bottom:1px solid #252535;padding:10px 0;display:flex;justify-content:space-between;align-items:center}
.pval{font-size:20px;font-weight:700;color:#C8FF57}

.stitle{font-size:9px;color:#6B6B88;letter-spacing:4px;text-transform:uppercase;margin:22px 0 10px}
.empty{text-align:center;padding:48px 0;color:#6B6B88;font-size:11px;letter-spacing:2px;line-height:2}

.plcard{background:#1A1A24;border:1px solid #252535;padding:14px;margin-bottom:14px;border-radius:3px}
.pldt{font-size:22px;font-weight:700;color:#C8FF57;letter-spacing:2px;margin-bottom:12px}
.plex{border-bottom:1px solid #252535;padding:9px 0;display:flex;justify-content:space-between;align-items:center}
.plexn{font-size:12px}
.plexr{font-size:9px;color:#C8FF57;font-style:italic;margin-top:2px}
.plexs{font-size:9px;color:#6B6B88;text-align:right}
.plexpb{font-size:10px;color:#C8FF57;text-align:right;margin-top:2px}
.plfin{margin-top:12px;padding-top:10px;border-top:1px solid #252535}
.pfint{font-size:10px;color:#C8FF57;letter-spacing:3px;margin-bottom:5px}
.pfinm{font-size:9px;color:#6B6B88;margin-bottom:6px}
.pfinex{font-size:11px;color:#6B6B88;padding:2px 0}
.wtabs{display:flex;gap:8px;margin-bottom:16px}
.wtab{flex:1;padding:8px 0;font-size:9px;letter-spacing:2px;border:1px solid #252535;background:transparent;color:#6B6B88;cursor:pointer;border-radius:2px}
.wtab.on{border-color:#C8FF57;background:#C8FF5718;color:#C8FF57}
.wguid{font-size:10px;color:#6B6B88;margin-bottom:18px;line-height:1.8}
.nbox{background:#C8FF5712;border:1px solid #C8FF5740;padding:14px;margin-top:4px;border-radius:3px;margin-bottom:4px}
.nbxt{font-size:10px;color:#C8FF57;letter-spacing:3px;margin-bottom:7px}
.nbxd{font-size:11px;color:#6B6B88;line-height:1.8}
.genbtn{width:100%;padding:14px 0;background:#C8FF57;color:#0A0A0F;font-size:10px;letter-spacing:4px;text-transform:uppercase;border:none;cursor:pointer;font-weight:700;margin-top:10px;border-radius:2px}
.genbtn:disabled{background:#1A1A24;color:#6B6B88;cursor:not-allowed}
.draftb{background:#57B8FF18;border:1px solid #57B8FF40;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;border-radius:3px;margin-bottom:14px}
.draftb span{font-size:10px;color:#57B8FF;letter-spacing:2px}
.draftb button{background:none;border:none;color:#57B8FF;font-size:10px;cursor:pointer;letter-spacing:2px}
</style>

</head>
<body>
<div id="app">
<div class="flash" id="fl"></div>
<div class="hdr">
  <div class="badge" id="blk">Block 1 · Fat Loss</div>
  <div class="ttl">TRAIN<span>.</span></div>
  <div class="dt" id="dt"></div>
</div>
<div class="tabs">
  <button class="tb on" onclick="go(0)">Session</button>
  <button class="tb" onclick="go(1)">Plan</button>
  <button class="tb" onclick="go(2)">History</button>
  <button class="tb" onclick="go(3)">Stats</button>
</div>
<div class="sec on" id="t0">
  <div class="draftb" id="draftb" style="display:none"><span>📝 Draft restored</span><button onclick="go(0)">RESUME</button></div>
  <div class="lbl" style="margin-top:0">Select Day</div>
  <div class="row2">
    <button class="dbtn on" id="dA" onclick="selDay('A')">Day A</button>
    <button class="dbtn" id="dB" onclick="selDay('B')">Day B</button>
  </div>
  <div id="dsub" style="font-size:10px;color:#6B6B88;margin-bottom:16px;letter-spacing:2px"></div>
  <div id="exc"></div>
  <div id="finc"></div>
  <div class="lbl">Session Notes</div>
  <textarea class="ta" id="snote" rows="3" placeholder="How did it feel?"></textarea>
  <button class="btnp" onclick="saveS()">Save Session</button>
</div>
<div class="sec" id="t1">
  <div class="stitle" id="plbt">Block 1 — Your Plan</div>
  <div class="wtabs">
    <button class="wtab on" onclick="selW(1)">W1</button>
    <button class="wtab" onclick="selW(2)">W2</button>
    <button class="wtab" onclick="selW(3)">W3</button>
    <button class="wtab" onclick="selW(4)">W4</button>
  </div>
  <div class="wguid" id="wg"></div>
  <div id="plc"></div>
  <div class="nbox"><div class="nbxt">NEXT BLOCK</div><div class="nbxd">Complete 4 weeks then generate your next block. AI analyses your weights and introduces new exercises automatically.</div></div>
  <button class="genbtn" id="genbtn" onclick="genPlan()">⚡ Generate Next 4-Week Block</button>
</div>
<div class="sec" id="t2"><div id="hc"></div></div>
<div class="sec" id="t3">
  <div class="card">
    <div style="font-size:11px;color:#C8FF57;letter-spacing:3px;margin-bottom:12px">LOG TODAY</div>
    <div class="lbl" style="margin-top:0">Body Weight (kg)</div>
    <input class="inp" type="number" id="sw" placeholder="e.g. 82.5" style="width:100%;margin-bottom:4px">
    <div class="lbl">How do you feel?</div>
    <div class="feelrow" id="fr"></div>
    <div class="lbl">Notes</div>
    <textarea class="ta" id="stn" rows="2" placeholder="Clothes fitting? Energy? Sleep?"></textarea>
    <button class="btnp" onclick="saveSt()">Log Stats</button>
  </div>
  <div id="stc"></div>
  <div id="pbc"></div>
</div>
</div>

<script>
var SK='trk_v4';
var FL=['😩','😕','😐','😊','💪'];
var WG=['Foundation — form & technique','Build — add weight where you can','Push — higher intensity','Consolidate — test your bests'];
var IP={
  A:{name:'Day A — Push & Pull',exercises:[
    {name:'Barbell Back Squat',sets:3,reps:8,rpe:'7/10 — controlled depth'},
    {name:'Dumbbell Bench Press',sets:3,reps:10,rpe:'Leave 2 reps in tank'},
    {name:'Cable Row (Seated)',sets:3,reps:10,rpe:'Full stretch, controlled pull'},
    {name:'Dumbbell Shoulder Press',sets:3,reps:10,rpe:'No arching lower back'},
    {name:'Romanian Deadlift',sets:3,reps:10,rpe:'Light-moderate, hinge well'},
    {name:'Plank',sets:3,reps:'45s',rpe:'Brace hard, neutral spine'}
  ],finisher:{name:'The Burner',duration:'12 mins',rest:'90 sec rest between rounds',rounds:3,exercises:[
    {name:'Ski Erg',detail:'250m per round'},
    {name:'Burpee Broad Jumps',detail:'10 reps — explosive jump forward'},
    {name:'Farmers Carry',detail:'40m — heavy as posture allows'}
  ]}},
  B:{name:'Day B — Hinge & Pull',exercises:[
    {name:'Conventional Deadlift',sets:3,reps:6,rpe:'Moderate — form first'},
    {name:'Incline Dumbbell Press',sets:3,reps:10,rpe:'30-45 degrees, controlled'},
    {name:'Pull-Ups / Lat Pulldown',sets:3,reps:10,rpe:'Full hang, squeeze at top'},
    {name:'Goblet Squat',sets:3,reps:12,rpe:'Lighter than Day A squats'},
    {name:'Cable Lateral Raise',sets:3,reps:12,rpe:'Slow eccentric — 3 sec down'},
    {name:'Dead Bug',sets:3,reps:'8 each',rpe:'Lower back flat — always'}
  ],finisher:{name:'The Grind',duration:'12 mins',rest:'90 sec rest between rounds',rounds:3,exercises:[
    {name:'Rowing Machine',detail:'250m per round — strong drive'},
    {name:'Wall Balls',detail:'15 reps — 6-9kg ball, full squat'},
    {name:'Sled Push or Pull',detail:'20m — moderate load, fast feet'}
  ]}}
};

var st=ls();
var cd='A';
var sl={};
var fl2={};
var fd=false;
var cf='3';
var aw=1;

function ls(){try{var r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch(e){}return{logs:[],stats:[],plan:JSON.parse(JSON.stringify(IP)),wb:1,draft:null};}
function ss(){try{localStorage.setItem(SK,JSON.stringify(st));}catch(e){}}
function sd(){st.draft={day:cd,sl:JSON.parse(JSON.stringify(sl)),fl:JSON.parse(JSON.stringify(fl2)),fd:fd,note:document.getElementById('snote').value};ss();}
function flash(m){var e=document.getElementById('fl');e.textContent=m;e.classList.add('on');setTimeout(function(){e.classList.remove('on');},2500);}
function fd2(iso){return new Date(iso).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});}
function gb(){var b={};st.logs.forEach(function(l){Object.keys(l.sets||{}).forEach(function(ex){Object.values(l.sets[ex]).forEach(function(s){var w=parseFloat(s.w);if(!isNaN(w)&&w>0&&(!b[ex]||w>b[ex]))b[ex]=w;});});});return b;}

function go(i){
  document.querySelectorAll('.sec').forEach(function(s,x){s.classList.toggle('on',x===i);});
  document.querySelectorAll('.tb').forEach(function(b,x){b.classList.toggle('on',x===i);});
  if(i===2)rHist();
  if(i===3)rStats();
  if(i===1)rPlan();
}

function selDay(d){cd=d;sl={};fl2={};fd=false;document.getElementById('dA').classList.toggle('on',d==='A');document.getElementById('dB').classList.toggle('on',d==='B');rEx();sd();}

function rEx(){
  var p=st.plan[cd];var b=gb();
  document.getElementById('dsub').textContent=p.name;
  var h='';
  p.exercises.forEach(function(ex,ei){
    var bv=b[ex.name]?'<div class="pb"><div class="pbl">BEST</div><div class="pbv">'+b[ex.name]+'kg</div></div>':'';
    var rows='';
    for(var i=0;i<ex.sets;i++){
      var wv=(sl[ex.name]&&sl[ex.name][i]&&sl[ex.name][i].w)||'';
      var rv=(sl[ex.name]&&sl[ex.name][i]&&sl[ex.name][i].r)||'';
      rows+='<div class="sr"><span class="sn">S'+(i+1)+'</span>'
        +'<input class="inp" type="number" placeholder="kg" value="'+wv+'" oninput="us(\''+ex.name+'\','+i+',\'w\',this.value)">'
        +'<input class="inp" type="number" placeholder="reps" value="'+rv+'" oninput="us(\''+ex.name+'\','+i+',\'r\',this.value)">'
        +'</div>';
    }
    h+='<div class="card"><div class="exh"><div style="flex:1;padding-right:8px"><div class="exn">'+ex.name+'</div><div class="exm">'+ex.sets+' sets x '+ex.reps+' reps</div><div class="exr">'+ex.rpe+'</div></div>'+bv+'</div>'+rows+'</div>';
  });
  document.getElementById('exc').innerHTML=h;

  var fin=p.finisher;
  var fh='<div class="fcard"><div class="ftitle">FINISHER: '+fin.name+'</div><div class="fmeta">'+fin.rounds+' rounds · '+fin.duration+' · '+fin.rest+'</div>';
  fin.exercises.forEach(function(ex){
    var wv=(fl2[ex.name]&&fl2[ex.name].w)||'';
    var rv=(fl2[ex.name]&&fl2[ex.name].r)||'';
    fh+='<div class="fex"><div class="fen">'+ex.name+'</div><div class="fed">'+ex.detail+'</div>'
      +'<div class="row2" style="margin-bottom:0">'
      +'<input class="inp" type="text" placeholder="Weight/load" value="'+wv+'" oninput="uf(\''+ex.name+'\',\'w\',this.value)">'
      +'<input class="inp" type="text" placeholder="Reps/dist" value="'+rv+'" oninput="uf(\''+ex.name+'\',\'r\',this.value)">'
      +'</div></div>';
  });
  fh+='<div class="fchk"><input type="checkbox" id="fdc" '+(fd?'checked':'')+' onchange="fd=this.checked;sd()"><label for="fdc">Finisher done</label></div></div>';
  document.getElementById('finc').innerHTML=fh;
}

function us(ex,i,f,v){if(!sl[ex])sl[ex]={};if(!sl[ex][i])sl[ex][i]={};sl[ex][i][f]=v;sd();}
function uf(ex,f,v){if(!fl2[ex])fl2[ex]={};fl2[ex][f]=v;sd();}

function saveS(){
  var note=document.getElementById('snote').value;
  var e={id:Date.now(),date:new Date().toISOString(),day:cd,dayName:st.plan[cd].name,sets:JSON.parse(JSON.stringify(sl)),fins:JSON.parse(JSON.stringify(fl2)),finisher:fd,note:note,wb:st.wb};
  st.logs.unshift(e);st.draft=null;ss();
  sl={};fl2={};fd=false;
  document.getElementById('snote').value='';
  rEx();flash('Session saved');
}

function selW(w){aw=w;document.querySelectorAll('.wtab').forEach(function(b,i){b.classList.toggle('on',i+1===w);});document.getElementById('wg').textContent=WG[w-1];}

function rPlan(){
  var b=gb();
  document.getElementById('plbt').textContent='Block '+st.wb+' — Your Plan';
  document.getElementById('wg').textContent=WG[aw-1];
  var h='';
  ['A','B'].forEach(function(d){
    var p=st.plan[d];
    var ex2=p.exercises.map(function(ex){
      return'<div class="plex"><div><div class="plexn">'+ex.name+'</div><div class="plexr">'+ex.rpe+'</div></div>'
        +'<div><div class="plexs">'+ex.sets+'x'+ex.reps+'</div>'+(b[ex.name]?'<div class="plexpb">PB '+b[ex.name]+'kg</div>':'')+'</div></div>';
    }).join('');
    var fin2=p.finisher.exercises.map(function(fx){return'<div class="pfinex">· '+fx.name+' — '+fx.detail+'</div>';}).join('');
    h+='<div class="plcard"><div class="pldt">'+p.name+'</div>'+ex2
      +'<div class="plfin"><div class="pfint">FINISHER: '+p.finisher.name+'</div>'
      +'<div class="pfinm">'+p.finisher.rounds+' rounds · '+p.finisher.duration+' · '+p.finisher.rest+'</div>'+fin2+'</div></div>';
  });
  document.getElementById('plc').innerHTML=h;
}

function genPlan(){
  var btn=document.getElementById('genbtn');
  btn.disabled=true;btn.textContent='Generating...';
  var sum=st.logs.slice(0,8).map(function(l){return{day:l.day,exercises:Object.keys(l.sets||{}).map(function(ex){return{name:ex,sets:Object.values(l.sets[ex]).map(function(s){return(s.w||'?')+'kg x '+(s.r||'?');})};});};});
  var prompt='S&C coach. New 4-week gym plan. Fat loss focus. Lower back issues - careful with axial loading, build core. Full gym. 2x/week full body.\nPrev Day A: '+st.plan.A.exercises.map(function(e){return e.name;}).join(', ')+'\nPrev Day B: '+st.plan.B.exercises.map(function(e){return e.name;}).join(', ')+'\nData: '+JSON.stringify(sum)+'\nIntroduce 3-4 NEW exercises. Progressive overload. 10-15 reps accessories, 6-10 compounds.\nReturn ONLY JSON:\n{"A":{"name":"Day A — theme","exercises":[{"name":"","sets":3,"reps":10,"rpe":""}],"finisher":{"name":"","duration":"12 mins","rest":"90 sec between rounds","rounds":3,"exercises":[{"name":"","detail":""}]}},"B":{same}}';
  fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})})
  .then(function(r){return r.json();})
  .then(function(d){
    var t=(d.content||[]).map(function(c){return c.text||'';}).join('');
    var np=JSON.parse(t.replace(/```json|```/g,'').trim());
    st.plan=np;st.wb++;ss();
    document.getElementById('blk').textContent='Block '+st.wb+' · Fat Loss';
    rPlan();flash('New block ready');
  })
  .catch(function(){flash('Failed — try again');})
  .finally(function(){btn.disabled=false;btn.textContent='Generate Next 4-Week Block';});
}

function rHist(){
  if(!st.logs.length){document.getElementById('hc').innerHTML='<div class="empty">No sessions yet.<br>Get after it.</div>';return;}
  var h='';
  st.logs.forEach(function(l){
    var ec=Object.keys(l.sets||{}).length;
    h+='<div class="li" onclick="tlog('+l.id+')">'
      +'<div class="ld">'+fd2(l.date)+(l.wb?' · Block '+l.wb:'')+'</div>'
      +'<div class="lt">'+l.dayName+'</div>'
      +'<div class="lm"><span>'+ec+' exercises'+(l.finisher?' · Finisher done':'')+'</span><span style="color:#C8FF57" id="ar'+l.id+'">▼</span></div>'
      +'</div>'
      +'<div class="ldtl" id="dt'+l.id+'">'+rld(l)+'</div>';
  });
  document.getElementById('hc').innerHTML=h;
}

function rld(l){
  var h='';
  Object.keys(l.sets||{}).forEach(function(ex){
    h+='<div class="let">'+ex+'</div>';
    Object.keys(l.sets[ex]).forEach(function(si){
      var s=l.sets[ex][si];
      h+='<div class="les">Set '+(parseInt(si)+1)+': '+(s.w||'-')+'kg x '+(s.r||'-')+' reps</div>';
    });
  });
  if(Object.keys(l.fins||{}).length){
    h+='<div class="let" style="margin-top:10px">FINISHER</div>';
    Object.keys(l.fins).forEach(function(ex){var s=l.fins[ex];h+='<div class="les">'+ex+': '+(s.w||'-')+' · '+(s.r||'-')+'</div>';});
  }
  if(l.note)h+='<div style="font-size:10px;color:#6B6B88;margin-top:8px;font-style:italic">"'+l.note+'"</div>';
  h+='<button class="btno" onclick="xtcx('+l.id+')">Export to Training Peaks (.tcx)</button>';
  return h;
}

function tlog(id){var d=document.getElementById('dt'+id);var a=document.getElementById('ar'+id);var o=d.classList.contains('on');d.classList.toggle('on',!o);a.textContent=o?'▼':'▲';}

function xtcx(id){
  var l=st.logs.find(function(x){return x.id===id;});if(!l)return;
  var dt=new Date(l.date).toISOString();var ac='';
  Object.keys(l.sets||{}).forEach(function(ex){Object.keys(l.sets[ex]).forEach(function(si){var s=l.sets[ex][si];if(s.w||s.r){ac+='<Activity Sport="Other"><Id>'+dt+'</Id><Lap StartTime="'+dt+'"><TotalTimeSeconds>60</TotalTimeSeconds><Notes>'+ex+' Set '+(parseInt(si)+1)+': '+(s.w||'?')+'kg x '+(s.r||'?')+'reps</Notes><Intensity>Active</Intensity><TriggerMethod>Manual</TriggerMethod></Lap></Activity>';}});});
  var tcx='<?xml version="1.0" encoding="UTF-8"?><TrainingCenterDatabase xmlns="http://www.garmin.com/xmlschemas/TrainingCenterDatabase/v2"><Activities>'+ac+'</Activities></TrainingCenterDatabase>';
  var blob=new Blob([tcx],{type:'application/xml'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='session_'+new Date(l.date).toISOString().slice(0,10)+'.tcx';a.click();URL.revokeObjectURL(url);
}

function rStats(){
  document.getElementById('fr').innerHTML=FL.map(function(f,i){return'<button class="fbtn'+(cf===String(i+1)?' on':'')+'" onclick="sf('+(i+1)+')">'+f+'</button>';}).join('');
  var sc='';
  if(st.stats.length){
    sc+='<div class="stitle">Weight Trend</div>';
    st.stats.slice(0,10).forEach(function(s,i,arr){
      var prev=arr[i+1];var diff=prev?(parseFloat(s.w)-parseFloat(prev.w)).toFixed(1):null;
      var dh='';if(diff!==null){var dc=parseFloat(diff)<0?'ddown':'dup';var da=parseFloat(diff)<0?'▼':'▲';dh='<div class="stdf '+dc+'">'+da+' '+Math.abs(diff)+'kg</div>';}
      sc+='<div class="strow"><div><div class="std">'+new Date(s.date).toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</div>'+(s.note?'<div style="font-size:9px;color:#6B6B88;font-style:italic">'+s.note+'</div>':'')+'</div>'
        +'<div class="str"><span style="font-size:20px">'+FL[parseInt(s.feel)-1]+'</span><div><div class="stw">'+s.w+'kg</div>'+dh+'</div></div></div>';
    });
  }
  document.getElementById('stc').innerHTML=sc;
  var b=gb();var ph='';
  if(Object.keys(b).length){ph+='<div class="stitle">Personal Bests</div>';Object.keys(b).forEach(function(ex){ph+='<div class="prow"><span>'+ex+'</span><span class="pval">'+b[ex]+'kg</span></div>';});}
  document.getElementById('pbc').innerHTML=ph;
}

function sf(i){cf=String(i);document.querySelectorAll('.fbtn').forEach(function(b,x){b.classList.toggle('on',x+1===i);});}

function saveSt(){
  var w=document.getElementById('sw').value;if(!w)return;
  var n=document.getElementById('stn').value;
  st.stats.unshift({id:Date.now(),date:new Date().toISOString(),w:w,feel:cf,note:n});ss();
  document.getElementById('sw').value='';document.getElementById('stn').value='';
  rStats();flash('Stats logged');
}

// BOOT
document.getElementById('dt').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
document.getElementById('blk').textContent='Block '+st.wb+' · Fat Loss';
if(st.draft){
  cd=st.draft.day||'A';
  sl=st.draft.sl||{};
  fl2=st.draft.fl||{};
  fd=st.draft.fd||false;
  if(st.draft.note)document.getElementById('snote').value=st.draft.note;
  if(Object.keys(sl).length||fd)document.getElementById('draftb').style.display='flex';
}
document.getElementById('dA').classList.toggle('on',cd==='A');
document.getElementById('dB').classList.toggle('on',cd==='B');
document.getElementById('snote').addEventListener('input',sd);
rEx();
</script>
